name: build-and-deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
    docker:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image-name: ${{ env.IMAGE_NAME }}
            image-tag: ${{ github.sha }}

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  build-args: |
                      SAMPCTL_GITHUB_TOKEN=${{ secrets.GH_PAT }}

    deploy:
        needs: docker
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read

        steps:
            - uses: appleboy/ssh-action@v1.0.3
              env:
                  APP_DIR: /opt/chiliad
                  APP_NAME: chiliad
                  GHCR_USERNAME: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GH_PAT }}
                  REPO_TOKEN: ${{ github.token }}
                  IMAGE_NAME: ${{ needs.docker.outputs.image-name }}
                  IMAGE_TAG: ${{ needs.docker.outputs.image-tag }}
                  MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
                  MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
                  MYSQL_USER: ${{ secrets.MYSQL_USER }}
                  MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
                  MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  envs: APP_DIR,APP_NAME,GHCR_USERNAME,GHCR_TOKEN,REPO_TOKEN,IMAGE_NAME,IMAGE_TAG,MYSQL_HOST,MYSQL_PORT,MYSQL_USER,MYSQL_PASSWORD,MYSQL_DATABASE
                  script: |
                      set -eu
                      export APP_DIR APP_NAME GHCR_USERNAME GHCR_TOKEN IMAGE_NAME IMAGE_TAG MYSQL_HOST MYSQL_PORT MYSQL_USER MYSQL_PASSWORD MYSQL_DATABASE
                      curl -fsSL -H "Authorization: Bearer $REPO_TOKEN" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/workflows/deploy.sh" | sh
